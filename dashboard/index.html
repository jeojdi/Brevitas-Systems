<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brevitas-mark.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brevitas-mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brevitas-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brevitas — Token Efficiency Dashboard</title>
    <!-- App.jsx only applies .dark from a post-mount useEffect, so without this
         pre-paint script dark-mode users get a white flash on every load. It is an
         external file, not an inline script, because the enforced dashboard CSP
         (next.config.ts dashboardCsp) is script-src 'self' with no 'unsafe-inline':
         inline it would be silently blocked in production. Deliberately not
         defer/module — a classic script in <head> blocks parsing, which is what
         guarantees it runs before the first paint. The absolute /dashboard/ path is
         required because the SPA is also served at /login, /signup etc. via
         rewrites, where a relative URL would resolve against the wrong base. -->
    <script src="/dashboard/boot-dark.js"></script>
    <!-- Shell backgrounds before the bundle's CSS arrives, so there is never an
         unstyled white (or, once .dark is set above, mismatched) frame while the
         module graph loads. Values mirror brand-bg / brand-dark-bg in
         tailwind.config.js and must move with them. -->
    <style>
      html, body { background-color: #eef0f7; }
      html.dark, html.dark body { background-color: #0c0c0c; }
    </style>
    <link href="/fonts/fonts.css" rel="stylesheet" />
  </head>
  <body class="dashboard-app">
    <div id="root"></div>
    <script src="/analytics.js" defer data-brevitas-analytics="true"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
