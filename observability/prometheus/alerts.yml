{
  "groups": [
    {
      "name": "brevitas-slo-burn-rates",
      "interval": "30s",
      "rules": [
        {
          "alert": "ExternalApiAvailabilityFastBurn",
          "expr": "(sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\",outcome=\"server_error\"}[1h])) / clamp_min(sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\"}[1h])), 0.000001) > (14.4 * 0.001)) and (sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\",outcome=\"server_error\"}[5m])) / clamp_min(sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\"}[5m])), 0.000001) > (14.4 * 0.001))",
          "for": "2m",
          "labels": {"severity": "page", "slo": "external-api-99.9"},
          "annotations": {"summary": "External API is rapidly consuming its 99.9% monthly SLA budget", "runbook": "docs/OBSERVABILITY.md#availability-burn"}
        },
        {
          "alert": "ExternalApiAvailabilitySlowBurn",
          "expr": "(sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\",outcome=\"server_error\"}[6h])) / clamp_min(sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\"}[6h])), 0.000001) > (6 * 0.001)) and (sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\",outcome=\"server_error\"}[30m])) / clamp_min(sum(rate(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\"}[30m])), 0.000001) > (6 * 0.001))",
          "for": "15m",
          "labels": {"severity": "ticket", "slo": "external-api-99.9"},
          "annotations": {"summary": "External API is steadily consuming its 99.9% monthly SLA budget", "runbook": "docs/OBSERVABILITY.md#availability-burn"}
        },
        {
          "alert": "ExternalApiMonthlySLABreach",
          "expr": "sum(increase(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\",outcome=\"server_error\"}[30d])) / clamp_min(sum(increase(brevitas_api_requests_total{surface=\"external\",sla_eligible=\"true\"}[30d])), 1) > 0.001",
          "for": "5m",
          "labels": {"severity": "page", "slo": "external-api-99.9"},
          "annotations": {"summary": "External API is below its 99.9% monthly availability target", "runbook": "docs/OBSERVABILITY.md#availability-burn"}
        },
        {
          "alert": "InternalAvailabilityFastBurn",
          "expr": "(sum(rate(brevitas_service_operations_total{surface=\"internal\",outcome=~\"server_error|unavailable|failed\"}[1h])) / clamp_min(sum(rate(brevitas_service_operations_total{surface=\"internal\"}[1h])), 0.000001) > (14.4 * 0.0005)) and (sum(rate(brevitas_service_operations_total{surface=\"internal\",outcome=~\"server_error|unavailable|failed\"}[5m])) / clamp_min(sum(rate(brevitas_service_operations_total{surface=\"internal\"}[5m])), 0.000001) > (14.4 * 0.0005))",
          "for": "2m",
          "labels": {"severity": "page", "slo": "internal-99.95"},
          "annotations": {"summary": "Internal services are rapidly consuming their 99.95% availability budget", "runbook": "docs/OBSERVABILITY.md#availability-burn"}
        },
        {
          "alert": "InternalAvailabilitySlowBurn",
          "expr": "(sum(rate(brevitas_service_operations_total{surface=\"internal\",outcome=~\"server_error|unavailable|failed\"}[6h])) / clamp_min(sum(rate(brevitas_service_operations_total{surface=\"internal\"}[6h])), 0.000001) > (6 * 0.0005)) and (sum(rate(brevitas_service_operations_total{surface=\"internal\",outcome=~\"server_error|unavailable|failed\"}[30m])) / clamp_min(sum(rate(brevitas_service_operations_total{surface=\"internal\"}[30m])), 0.000001) > (6 * 0.0005))",
          "for": "15m",
          "labels": {"severity": "ticket", "slo": "internal-99.95"},
          "annotations": {"summary": "Internal services are steadily consuming their 99.95% availability budget", "runbook": "docs/OBSERVABILITY.md#availability-burn"}
        }
      ]
    },
    {
      "name": "brevitas-service-health",
      "interval": "30s",
      "rules": [
        {
          "alert": "ExternalApiOperationalFailureRate",
          "expr": "sum(rate(brevitas_api_requests_total{surface=\"external\",outcome=~\"server_error|unavailable\"}[10m])) / clamp_min(sum(rate(brevitas_api_requests_total{surface=\"external\"}[10m])), 0.000001) > 0.02",
          "for": "10m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "All-domain external API failure ratio exceeds 2%, including SLA-excluded faults", "runbook": "docs/OBSERVABILITY.md#api-errors-and-latency"}
        },
        {
          "alert": "ExternalApiHighLatency",
          "expr": "histogram_quantile(0.95, sum by (le) (rate(brevitas_api_request_duration_seconds_bucket{surface=\"external\"}[10m]))) > 2",
          "for": "10m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "External API p95 latency exceeds two seconds", "runbook": "docs/OBSERVABILITY.md#api-errors-and-latency"}
        },
        {
          "alert": "ProviderFailureRateHigh",
          "expr": "sum by (provider) (rate(brevitas_provider_requests_total{outcome!=\"success\"}[10m])) / clamp_min(sum by (provider) (rate(brevitas_provider_requests_total[10m])), 0.000001) > 0.10",
          "for": "10m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "A provider failure rate exceeds 10%", "runbook": "docs/OBSERVABILITY.md#provider-degradation"}
        },
        {
          "alert": "ProviderCircuitOpen",
          "expr": "sum by (provider) (increase(brevitas_provider_circuit_total{state=\"open\"}[5m])) > 0",
          "for": "1m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "A provider circuit breaker opened", "runbook": "docs/OBSERVABILITY.md#provider-degradation"}
        },
        {
          "alert": "DurableJobDead",
          "expr": "sum(increase(brevitas_jobs_total{status=\"dead\"}[10m])) > 0",
          "for": "1m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "A durable job entered the dead state", "runbook": "docs/OBSERVABILITY.md#jobs-and-queue"}
        },
        {
          "alert": "DurableJobQueueLag",
          "expr": "max(brevitas_queue_lag_seconds{queue=\"jobs\"}) > 300",
          "for": "5m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "Durable job queue lag exceeds five minutes", "runbook": "docs/OBSERVABILITY.md#jobs-and-queue"}
        },
        {
          "alert": "BillingQueueLag",
          "expr": "max(brevitas_billing_queue_lag_seconds) > 300",
          "for": "5m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "Billing recovery lag exceeds five minutes", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "BillingEntriesRequireReview",
          "expr": "max(brevitas_billing_review) >= 1",
          "for": "1m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "Billing ledger contains entries requiring review", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "BillingDeadOrStale",
          "expr": "max(brevitas_billing_dead) >= 1 or max(brevitas_billing_stale) >= 1",
          "for": "1m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "Billing ledger has dead entries or stale sending leases", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "BillingCatalogContractInvalid",
          "expr": "min(brevitas_billing_catalog_contract) < 1",
          "for": "1m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "At least one billing-worker replica reports an invalid Stripe catalog contract", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "BillingCatalogContractMissing",
          "expr": "absent(brevitas_billing_catalog_contract) == 1",
          "for": "5m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "No authoritative billing loop is reporting catalog contract health", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "PostgresDegraded",
          "expr": "sum(rate(brevitas_dependency_operations_total{dependency=\"postgres\",outcome!=\"success\"}[5m])) > 0",
          "for": "5m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "Authoritative Postgres dependency is degraded", "runbook": "docs/OBSERVABILITY.md#dependencies"}
        },
        {
          "alert": "RedisDegraded",
          "expr": "sum(rate(brevitas_dependency_operations_total{dependency=\"redis\",outcome!=\"success\"}[5m])) > 0",
          "for": "5m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "Redis coordination dependency is degraded", "runbook": "docs/OBSERVABILITY.md#dependencies"}
        },
        {
          "alert": "CompressorDegraded",
          "expr": "sum(rate(brevitas_dependency_operations_total{dependency=\"compressor\",outcome!=\"success\"}[5m])) / clamp_min(sum(rate(brevitas_dependency_operations_total{dependency=\"compressor\"}[5m])), 0.000001) > 0.05",
          "for": "5m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "Private compressor error ratio exceeds 5%", "runbook": "docs/OBSERVABILITY.md#dependencies"}
        }
      ]
    },
    {
      "name": "brevitas-detective-controls",
      "interval": "60s",
      "rules": [
        {
          "record": "brevitas_alerting_armed_telemetry_absence",
          "expr": "vector(0)",
          "labels": {"gate": "disarmed"}
        },
        {
          "record": "brevitas_alerting_armed_billing_volume",
          "expr": "vector(0)",
          "labels": {"gate": "disarmed"}
        },
        {
          "record": "brevitas_alerting_armed_auth_denial",
          "expr": "vector(0)",
          "labels": {"gate": "disarmed"}
        },
        {
          "alert": "ExternalApiTelemetrySilent",
          "expr": "(absent_over_time(brevitas_api_requests_total[30m]) == 1) and on() (brevitas_alerting_armed_telemetry_absence == 1)",
          "for": "30m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "No API replica is reporting request metrics, so every availability rule is evaluating absent series", "arming": "Disarmed by default: set brevitas_alerting_armed_telemetry_absence to vector(1) only after BREVITAS_OTEL_ENABLED=true is confirmed on every API replica and a non-zero brevitas_api_requests_total has been observed. Until then this rule would fire permanently instead of detecting a regression.", "runbook": "docs/OBSERVABILITY.md#availability-burn"}
        },
        {
          "alert": "InternalTelemetrySilent",
          "expr": "(absent_over_time(brevitas_service_operations_total[30m]) == 1) and on() (brevitas_alerting_armed_telemetry_absence == 1)",
          "for": "30m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "No worker or internal service is reporting operation metrics", "arming": "Shares the brevitas_alerting_armed_telemetry_absence gate with ExternalApiTelemetrySilent; arm both together.", "runbook": "docs/OBSERVABILITY.md#availability-burn"}
        },
        {
          "alert": "BillableSavingsStalledWhileServingTraffic",
          "expr": "((sum(rate(brevitas_billing_savings_rows_total{billable=\"true\"}[6h])) or vector(0)) == 0) and (sum(rate(brevitas_api_requests_total{surface=\"external\"}[6h])) > 0) and on() (brevitas_alerting_armed_billing_volume == 1)",
          "for": "30m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "Customers are still sending traffic but no billable verified savings are being produced", "arming": "Disarmed by default because the pipeline currently produces no billable verified savings (none since 2026-07-17), so an armed rule would fire immediately and permanently — the worst possible state for a detective control. Set brevitas_alerting_armed_billing_volume to vector(1) once brevitas_billing_savings_rows_total{billable=\"true\"} has been non-zero for a full settlement period. The traffic clause means it cannot fire during legitimate idleness.", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "VerifiedSavingsDollarsCollapsedWhileRowsContinue",
          "expr": "(sum(rate(brevitas_billing_verified_savings_usd_total[6h])) == 0) and (sum(rate(brevitas_billing_savings_rows_total{billable=\"true\"}[6h])) > 0) and on() (brevitas_alerting_armed_billing_volume == 1)",
          "for": "30m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "Billable usage rows are still being written but their verified savings sum to zero dollars", "arming": "Disarmed by default: it shares the brevitas_alerting_armed_billing_volume gate. The producer IS now wired — api/server.py::_record_usage_report passes verified_savings_usd on every persisted row — so every row emits the counter including a zero one and rate()==0 is a real observation rather than an absence. The dollar clause still deliberately omits `or vector(0)`, which now only means the rule stays silent on a replica that has never written a row (fresh process, no traffic) instead of reporting that replica as a revenue stall. Arm it with the same switch as BillableSavingsStalledWhileServingTraffic — after brevitas_billing_verified_savings_usd_total has been non-zero for a full settlement period. This is the magnitude half of the control: the rows rule cannot see a pipeline that keeps writing rows repriced to nothing (2026-07-29).", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "BillingSettlementStale",
          "expr": "(max(brevitas_billing_last_settlement_age_seconds) > 172800) and on() (brevitas_alerting_armed_billing_volume == 1)",
          "for": "30m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "No billing settlement has been written in two days, sized to the seven-day period cadence", "arming": "Shares the brevitas_alerting_armed_billing_volume gate; also requires the billing loop to export brevitas.billing.last_settlement_age (fail-closed seed) before arming.", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "ExternalApiAuthDenialSpike",
          "expr": "(sum(rate(brevitas_api_requests_total{surface=\"external\",outcome=\"auth_denied\"}[30m])) / clamp_min(sum(rate(brevitas_api_requests_total{surface=\"external\"}[30m])), 0.000001) > 0.25) and on() (brevitas_alerting_armed_auth_denial == 1)",
          "for": "30m",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "More than a quarter of external API traffic is being rejected as unauthenticated or forbidden", "arming": "Disarmed by default: expired dashboard sessions and misconfigured customer SDKs produce a steady 401 baseline, so the 0.25 ratio must be checked against a real week of brevitas_api_requests_total{outcome=\"auth_denied\"} before arming brevitas_alerting_armed_auth_denial. Ticket, never page, so it cannot desensitise on-call to the burn-rate alerts.", "runbook": "docs/OBSERVABILITY.md#api-errors-and-latency"}
        },
        {
          "alert": "AuthoritativeUsageRowRatioCollapsed",
          "expr": "(((sum(rate(brevitas_billing_savings_rows_total{authoritative=\"true\"}[6h])) or vector(0)) / clamp_min(sum(rate(brevitas_billing_savings_rows_total[6h])), 0.000001)) < 0.05) and (sum(rate(brevitas_billing_savings_rows_total[6h])) > 0) and on() (brevitas_alerting_armed_billing_volume == 1)",
          "for": "30m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "Usage rows are still being persisted but almost none are authoritative, so nothing landing can ever become billable", "action": "Exists because production verified savings stopped on 2026-07-17 and nothing paged for 25 days; the ~28k rows written since all carry verified=0. authoritative=True reaches _record_usage_report from exactly ONE caller — api/server.py::_hosted_proxy_receipt — and every failure path in it returns early after logging a typed reason (missing_key, key_validity_unavailable, the key-invalid warning, or 'hosted proxy receipt write failed'). So this ratio collapsing means the hosted-proxy bridge is dropping receipts while still returning 200 to the customer, NOT that customers stopped calling. Grep those four reasons in the API logs first, confirm proxy routes are still serving 2xx on brevitas_api_requests_total, then reconcile the affected period before settlement closes it.", "arming": "Shares the brevitas_alerting_armed_billing_volume gate and arms with BillableSavingsStalledWhileServingTraffic; today every row is authoritative=false so an armed rule would fire permanently. Ratio rather than count ON PURPOSE: the existing count rule requires the billable rate to reach exactly zero fleet-wide, so a single healthy tenant holds it green while every other tenant's receipts are dropped. The rows-flowing clause means it cannot fire during legitimate idleness, and `or vector(0)` keeps a numerator whose label set has vanished entirely reading as zero rather than absent — absent never fires.", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "VerifiedSavingsConversionCollapsed",
          "expr": "(((sum(rate(brevitas_billing_savings_rows_total{billable=\"true\"}[6h])) or vector(0)) / clamp_min(sum(rate(brevitas_billing_savings_rows_total{authoritative=\"true\"}[6h])), 0.000001)) < 0.05) and (sum(rate(brevitas_billing_savings_rows_total{authoritative=\"true\"}[6h])) > 0) and on() (brevitas_alerting_armed_billing_volume == 1)",
          "for": "30m",
          "labels": {"severity": "page"},
          "annotations": {"summary": "Authoritative receipts are arriving normally but almost none of them convert into verified savings", "action": "The second half of the 2026-07-17 decomposition. billable is a STRICT SUBSET of authoritative — api/server.py gates verified savings on `authoritative and mode == \"byte_preserving\"` — so this ratio is the conversion rate of the money path and its denominator is authoritative rows, not all rows. A collapse here with AuthoritativeUsageRowRatioCollapsed silent means receipts are landing and being rejected downstream of delivery: check pricing_status='unpriced' (brevitas/receipts.py fails closed when MODEL_PRICES is silent for a newly added model or reseller) and check whether a strategy was reclassified out of byte_preserving. Do NOT clear it by widening the byte-preserving gate; that bills unproven savings.", "arming": "Shares the brevitas_alerting_armed_billing_volume gate. Its guard clause counts AUTHORITATIVE rows rather than all rows so that a dead hosted-proxy bridge pages exactly once, through AuthoritativeUsageRowRatioCollapsed, instead of paging twice for one fault. Complements VerifiedSavingsDollarsCollapsedWhileRowsContinue, which is the magnitude half over dollars; this is the population half over rows and sees a pipeline that still produces a few full-value rows while rejecting the rest.", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "VerifiedSavingsRowRatioDegraded",
          "expr": "(((sum(rate(brevitas_billing_savings_rows_total{billable=\"true\"}[24h])) or vector(0)) / clamp_min(sum(rate(brevitas_billing_savings_rows_total[24h])), 0.000001)) < 0.50) and (sum(rate(brevitas_billing_savings_rows_total[24h])) > 0) and on() (brevitas_alerting_armed_billing_volume == 1)",
          "for": "2h",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "Fewer than half of all persisted usage rows are producing verified savings", "action": "End-to-end conversion, and exactly the product of the two page rules above: (authoritative/all) x (billable/authoritative). It is the net that catches a PARTIAL regression — one provider's pricing table going silent, one strategy losing byte_preserving — which both 0.05 collapse thresholds are deliberately too conservative to see. Identify the regressed partition by provider/model in the receipt table, since the metric carries no tenant or provider label by design.", "arming": "Shares the brevitas_alerting_armed_billing_volume gate. The 0.50 threshold is UNCALIBRATED and it has a KNOWN BLIND SPOT: no armed baseline for the healthy billable fraction exists, because the pipeline has produced none since 2026-07-17, so 0.50 is a floor chosen to be unfirable rather than a measured boundary. If the healthy fraction turns out to be ~0.80, a regression to 0.60 is roughly a quarter of revenue gone and this rule stays silent. Recalibration is therefore MANDATORY, not optional: treat the first armed week as the calibration window and re-set the number against the observed fraction, the same discipline ExternalApiAuthDenialSpike's 0.25 is held to. Once a baseline exists, prefer a relative form (24h fraction against its own trailing 7d fraction), which self-calibrates and does not need this guess at all. Ticket, a 24h window and for:2h, never a page, precisely because an uncalibrated threshold must not be able to wake anyone.", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        },
        {
          "alert": "BillingDetectiveControlsDisarmedWhileServingTraffic",
          "expr": "((max(brevitas_alerting_armed_billing_volume) or vector(0)) < 1) and (sum(rate(brevitas_api_requests_total{surface=\"external\"}[6h])) > 0)",
          "for": "6h",
          "labels": {"severity": "ticket"},
          "annotations": {"summary": "Every billing-volume detective control is disarmed while the API is serving external traffic, so no rule can report a revenue stall", "action": "THIS is the rule that answers why nothing fired on 2026-07-17. A rule existed — BillableSavingsStalledWhileServingTraffic — but every billing-volume rule ends in `and on() (brevitas_alerting_armed_billing_volume == 1)`, and that gate is recorded as vector(0). The comparison yields an empty vector, so the whole expression is empty and the alert cannot fire in any state of the world. A disarmed detective control reports the identical green as a healthy one, which is how a revenue stop survived 25 days. Action: arm the gate per docs/OBSERVABILITY.md#billing-recovery (expr vector(0) -> vector(1) and labels.gate disarmed -> armed), or record the dated reason it must stay off. This rule self-clears the moment the gate flips.", "arming": "DELIBERATELY UNGATED — no brevitas_alerting_armed_* term, because gating the rule that detects disarmed rules would reproduce the exact defect it exists to catch. It is safe to arm today: unlike the rules it watches, its condition is one an operator can actually clear, and it terminates on the clearing action rather than on the money reappearing. Ticket, never page, and for:6h so it cannot flap on a Prometheus restart or a scrape gap. The external-traffic clause keeps it silent on an idle or pre-launch stack.", "runbook": "docs/OBSERVABILITY.md#billing-recovery"}
        }
      ]
    }
  ]
}
