[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brevitas-systems"
version = "0.9.12"
description = "Lossless token savings + per-pipeline/agent tracking between your agents and the model."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    # Imported at module scope by brevitas/security/envelope.py, brevitas/security/kms.py
    # and brevitas/semantic_cache.py. It reached the server image only through
    # api/requirements.txt, so a customer `pip install brevitas-systems` could resolve
    # without it and silently lose the local cache to a swallowed ImportError.
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "tiktoken>=0.7.0",
    "numpy>=1.24.0",
    "fastembed>=0.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "google-cloud-kms==3.15.0",
    "google-crc32c==1.8.0",
    # Codebase scanner behind `bvx install <repo>`; installing it here means any
    # `pip install brevitas-systems` also provides the `agentmap` CLI.
    "agentmap-scan>=0.1.1,<0.2",
]

[project.optional-dependencies]
# Compatibility alias: fastembed is now part of the base model installed by `bvx install`.
retrieval = []
# semantic response cache: local embeddings for reworded-match hits (numpy already core).
# Absent → the cache still runs exact-hash-only, no reworded matching.
semanticcache = ["sentence-transformers>=2.2.0"]
promptopt = ["llmlingua>=0.2.1"]
pdf = ["pymupdf>=1.23.0"]
anthropic = ["anthropic>=0.28.0"]
openai    = ["openai>=1.30.0"]
all       = ["sentence-transformers>=2.2.0", "llmlingua>=0.2.1", "anthropic>=0.28.0", "openai>=1.30.0", "pymupdf>=1.23.0"]

[project.scripts]
brevitas = "brevitas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brevitas*", "token_efficiency_model*"]
exclude = ["*.tests", "*.tests.*", "tests*", "benchmarks*", "examples*", "archive*"]

[tool.setuptools.package-data]
brevitas = ["samples/*.md"]

[tool.pytest.ini_options]
# Historical implementations under archive/ import modules that no longer
# exist. Keep default discovery broad so package-local active tests still run.
norecursedirs = ["archive"]
