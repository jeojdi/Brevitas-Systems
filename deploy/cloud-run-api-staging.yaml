apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: brevitas-api-staging
  labels:
    app: brevitas-api
    system: brevitas
    environment: staging
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/network-interfaces: >-
          [{"network":"brevitas-staging-vpc","subnetwork":"brevitas-staging-run-us-west1","tags":["brevitas-staging-run"]}]
        run.googleapis.com/vpc-access-egress: all-traffic
        run.googleapis.com/secrets: "supabase-url:projects/975273324573/secrets/brevitas-staging-supabase-url,supabase-service-role:projects/975273324573/secrets/brevitas-staging-supabase-service-role-key,redis-url:projects/975273324573/secrets/brevitas-staging-redis-url,cursor-secret:projects/975273324573/secrets/brevitas-staging-company-admin-cursor-secret,invitee-pepper:projects/975273324573/secrets/brevitas-staging-company-admin-invitee-pepper"
    spec:
      serviceAccountName: brevitas-staging-runtime@divine-camera-465917-j7.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - name: api
          image: us-west1-docker.pkg.dev/divine-camera-465917-j7/brevitas-staging/api:REPLACE_WITH_COMMIT_SHA
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: BREVITAS_ENV
              value: staging
            - name: BREVITAS_STORE
              value: supabase
            - name: BREVITAS_PROXY_AUTH
              value: "true"
            - name: BREVITAS_BUILD_SHA
              value: REPLACE_WITH_COMMIT_SHA
            - name: ALLOWED_ORIGINS
              value: https://brevitas-systems-staging.vercel.app
            # Cloud Run always injects K_SERVICE, so hosted_runtime() is true and
            # _validate_runtime_config() refuses to start without this. The single
            # proxy hop in front of the container is the Cloud Run front end at
            # 169.254.1.1; naming it (never "*", which api/server.py rejects) keeps
            # the rate-limit peer address off the client-supplied X-Forwarded-For
            # chain. Must equal the value on the live revision.
            - name: FORWARDED_ALLOW_IPS
              value: 169.254.1.1
            # Strictly below the startup probe's timeoutSeconds, so /v1/health/ready
            # answers 503 rather than hanging past the probe deadline.
            - name: BREVITAS_HEALTH_TIMEOUT_SECONDS
              value: "2"
            - name: BREVITAS_KMS_REQUIRED
              value: "true"
            - name: BREVITAS_KMS_PROVIDER
              value: google-cloud-kms
            - name: BREVITAS_KMS_KEY_ID
              value: projects/divine-camera-465917-j7/locations/global/keyRings/brevitas-staging/cryptoKeys/credential-envelope
            - name: BREVITAS_KMS_KEY_VERSION
              value: "1"
            - name: BREVITAS_KMS_ALGORITHM
              value: GOOGLE_SYMMETRIC_ENCRYPTION
            - name: BREVITAS_KMS_ADAPTER_FACTORY
              value: brevitas.security.google_cloud_kms:create_adapter
            - name: BREVITAS_KMS_ADAPTER_TRUSTED_MODULES
              value: brevitas.security.google_cloud_kms
            - name: BREVITAS_GCP_KMS_TIMEOUT_SECONDS
              value: "0.75"
            - name: BREVITAS_KMS_READINESS_TIMEOUT_SECONDS
              value: "1"
            - name: BREVITAS_KMS_READINESS_MAX_AGE_SECONDS
              value: "30"
            - name: BREVITAS_COMPRESS_REQUIRED
              value: "false"
            - name: BREVITAS_BILLING_ENABLED
              value: "false"
            # Half of the savings switch. The other half is per-tenant
            # (organizations.cache_enabled); BOTH must be on before a hosted
            # customer's traffic can produce verified savings, and this half was
            # in no deploy artifact at all — a replica that never read it
            # defaulted to "false" and quietly optimized nothing.
            # GET /v1/billing/readiness reports both halves.
            - name: BREVITAS_CACHE_ENABLED
              value: "true"
            # Prometheus scrape surface (GET /metrics). Enabled here so the
            # setting is checked-in knowledge rather than dashboard state, but
            # the route stays inert — it answers 404 — until
            # BREVITAS_METRICS_TOKEN is set as a managed secret. The token is
            # deliberately NOT declared here: it is a credential, and every
            # credential in this file arrives through secretKeyRef.
            - name: BREVITAS_METRICS_ENABLED
              value: "true"
            # OTel stays OFF until a collector exists, and is declared here so
            # that fact is visible instead of implied by absence. This is the
            # precondition observability/prometheus/alerts.yml names for arming
            # brevitas_alerting_armed_telemetry_absence: flip this to "true",
            # set OTEL_EXPORTER_OTLP_ENDPOINT to the collector, confirm a
            # non-zero brevitas_api_requests_total, and only then arm the rule.
            # Until then the /metrics mirror above is the series' only publisher.
            - name: BREVITAS_OTEL_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: api
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: "1"
                  name: supabase-url
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  key: "1"
                  name: supabase-service-role
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  key: "3"
                  name: redis-url
            - name: COMPANY_ADMIN_CURSOR_SECRET
              valueFrom:
                secretKeyRef:
                  key: "1"
                  name: cursor-secret
            - name: COMPANY_ADMIN_INVITEE_PEPPER
              valueFrom:
                secretKeyRef:
                  key: "1"
                  name: invitee-pepper
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          # Cloud Run has no readinessProbe, so startupProbe is the only lever that
          # can hold a revision back from traffic: it must prove Postgres authority,
          # Redis coordination and fresh active-KMS evidence, which only
          # /v1/health/ready does. /v1/health/live answers 200 unconditionally, so a
          # revision with a stale supabase-url/redis-url secret version used to take
          # 100% of traffic and 500 every request. ~60s budget, and timeoutSeconds
          # must be <= periodSeconds on Cloud Run.
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 5
          # Liveness stays on the dependency-free probe: a transient Redis or
          # Supabase blip must not cause a restart storm.
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8080
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
