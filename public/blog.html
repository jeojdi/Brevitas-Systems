<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/brevitas-mark.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brevitas-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brevitas-mark-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/brevitas-mark-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/brevitas-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Research & Blog · Brevitas Systems</title>
<meta name="description" content="Engineering notes and research from the Brevitas team on KV caches, inference and agent systems.">
<link href="/fonts/fonts.css" rel="stylesheet">
<script>/* pre-paint theme to prevent flash on navigation */(function(){try{var t=localStorage.getItem("theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");var r=localStorage.getItem("reduceMotion"),p=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;if(r==="1"||(!r&&p)){document.documentElement.setAttribute("data-reduce-motion","true");}}catch(e){}})();</script>
<link rel="stylesheet" href="/theme.css">
<script src="/theme-init.js" defer></script>
<link rel="stylesheet" href="/responsive.css">
<script src="/analytics.js" defer data-brevitas-analytics="true"></script>
<style>
.rb-hero { text-align: center; padding: 0 0 8px; }
.rb-title { font-family: 'Inter Tight', sans-serif; font-weight: 450; font-size: clamp(40px, 6vw, 72px); letter-spacing: -0.035em; line-height: 1.02; margin: 0 auto 28px; max-width: 900px; color: var(--fg); }
.rb-sub { font-family: 'Inter Tight', sans-serif; font-size: 18px; line-height: 1.55; color: var(--stone-2); max-width: 720px; margin: 0 auto; }

.rb-featured { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 56px 0 12px; }
.rb-fcard { position: relative; background: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 28px 32px; display: flex; flex-direction: column; justify-content: flex-start; text-decoration: none; transition: border-color 160ms var(--ease-out-standard), transform 160ms var(--ease-out-standard); }
.rb-fcard:hover { transform: translateY(-3px); border-color: var(--bronze); }
.rb-fcard h3 { font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.015em; color: var(--fg); margin: 0 0 8px; }
.rb-fcard .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.rb-fcard p { font-family: 'Inter Tight', sans-serif; font-size: 14px; line-height: 1.45; color: var(--stone-2); margin: 0; max-width: 62%; }
.rb-fcard .cta { font-family: 'Inter Tight', sans-serif; font-size: 14px; font-weight: 500; color: var(--bronze); white-space: nowrap; }

.rb-sec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin: 0 0 36px; }
.rb-sec-head h2 { font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.01em; color: var(--fg); margin: 0 0 10px; }
.rb-sec-head p { font-family: 'Inter Tight', sans-serif; font-size: 15px; line-height: 1.55; color: var(--stone-2); margin: 0; max-width: 620px; }

.rb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.rb-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; }
.rb-card .thumb { aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); margin-bottom: 18px; transition: transform 160ms var(--ease-out-standard); }
.rb-card:hover .thumb { transform: translateY(-3px); }
.rb-card h3 { font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 21px; letter-spacing: -0.01em; line-height: 1.18; color: var(--fg); margin: 0 0 12px; }
.rb-card p { font-family: 'Inter Tight', sans-serif; font-size: 14.5px; line-height: 1.5; color: var(--stone-2); margin: 0 0 16px; }
.rb-card .meta { font-family: 'Inter Tight', sans-serif; font-size: 13px; color: var(--stone); margin-top: auto; }

.rb-rows { border-top: 1px solid var(--line); }
.rb-row { display: grid; grid-template-columns: 96px 1fr auto; grid-template-areas: "thumb title read"; gap: 28px; align-items: center; padding: 26px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; transition: opacity 140ms; }
.rb-row:hover { opacity: 0.72; }
.rb-row .thumb { width: 96px; height: 96px; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
.rb-card .thumb img, .rb-row .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rb-row h3 { font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em; line-height: 1.18; color: var(--fg); margin: 0 0 8px; }
.rb-row .meta { font-family: 'Inter Tight', sans-serif; font-size: 13px; color: var(--stone); }
.rb-row .read { font-family: 'Inter Tight', sans-serif; font-size: 14px; font-weight: 500; color: var(--fg); white-space: nowrap; }

@media (max-width: 860px) {
  .rb-featured { grid-template-columns: 1fr; }
  .rb-grid { grid-template-columns: 1fr; gap: 36px; }
  .rb-sec-head { flex-direction: column; }
  .rb-row { grid-template-columns: 72px 1fr; grid-template-areas: "thumb title" "thumb read"; }
  .rb-row .thumb { width: 72px; height: 72px; }
  .rb-row .read { display: none; }
}
</style>
</head>
<body>
<div class="noise"></div>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<script src="/components.js" defer></script>

<script src="/pagejs/blog.js" defer></script>
</body>
</html>
