<style>
.splice-fig { margin: 8px 0 0; border: 1px solid var(--line); border-radius: 12px; background: var(--ink-2); padding: 20px 20px 16px; }
.splice-fig figcaption { font-size: 13px; color: var(--stone); margin-top: 12px; line-height: 1.5; }
.splice-fig h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--fg); }
.splice-fig .sub { font-size: 12.5px; color: var(--stone); margin: 0 0 14px; }
.splice-fig svg { display: block; width: 100%; height: auto; }
.splice-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--stone-2); margin-bottom: 10px; }
.splice-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.splice-table-wrap { overflow-x: auto; margin: 24px 0 0; border: 1px solid var(--line); border-radius: 12px; }
.splice-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.splice-table caption { text-align: left; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.splice-table caption b { display: block; font-size: 15px; color: var(--fg); font-weight: 600; }
.splice-table caption span { display: block; font-size: 12.5px; color: var(--stone); margin-top: 2px; }
.splice-table th { text-align: left; font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 12.5px; letter-spacing: 0; color: var(--stone); padding: 12px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.splice-table td { padding: 10px 18px; border-bottom: 1px solid var(--line); color: var(--stone-2); }
.splice-table tr:last-child td { border-bottom: 0; }
.splice-table td.n, .splice-table th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.splice-table td.hi { color: var(--fg); font-weight: 600; }
.splice-defs { display: grid; grid-template-columns: 150px 1fr; gap: 0; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
.splice-defs dt, .splice-defs dd { margin: 0; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.splice-defs dt { font-family: 'Inter Tight', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--stone-2); padding-top: 13px; }
.splice-defs dd { color: var(--stone-2); }
.splice-defs dt:last-of-type, .splice-defs dd:last-of-type { border-bottom: 0; }
.splice-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.splice-stat { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--ink-2); }
.splice-stat b { display: block; font-size: 32px; font-weight: 500; letter-spacing: -.02em; color: var(--fg); }
.splice-stat span { display: block; font-size: 13px; color: var(--stone); margin-top: 4px; line-height: 1.45; }
@media (max-width: 640px) {
  .splice-stats { grid-template-columns: 1fr; }
  .splice-defs { grid-template-columns: 1fr; }
  .splice-defs dt { border-bottom: 0; padding-bottom: 0; }
}
</style>
