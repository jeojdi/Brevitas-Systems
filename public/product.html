<style>
.prod-label { font-family: 'Inter Tight', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); margin: 0 0 14px; }
.prod-head { font-size: clamp(30px, 4.2vw, 46px); font-weight: 400; letter-spacing: -0.02em; line-height: 1.08; margin: 0 0 28px; color: var(--fg); max-width: 940px; }
.prod-img { display: block; width: 100%; max-width: 1080px; height: auto; border: 1px solid var(--line); border-radius: 4px; }
.prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 48px; margin-top: 12px; max-width: 960px; }
/* Keep body copy at a readable measure while sections span the full width, left-anchored. */
.section .t-body { max-width: 720px; }
.prod-feature { display: block; padding-top: 20px; border-top: 1px solid var(--line); }
.prod-feature h3 { font-size: 18px; font-weight: 600; margin: 0 0 8px; color: var(--fg); letter-spacing: -0.01em; }
.prod-feature p { font-size: 14.5px; line-height: 1.55; color: var(--stone-2); margin: 0; }
.prod-step { display: grid; grid-template-columns: 60px 1fr; gap: 24px; padding: 26px 0; border-top: 1px solid var(--line); max-width: 860px; }
.prod-step .n { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: var(--bronze); padding-top: 4px; }
.prod-step h3 { font-size: 19px; font-weight: 600; margin: 0 0 8px; color: var(--fg); letter-spacing: -0.01em; }
.prod-step p { font-size: 15px; line-height: 1.55; color: var(--stone-2); margin: 0; max-width: 640px; }
.prod-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; max-width: 860px; }
.prod-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.prod-table th { text-align: left; font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 12.5px; color: var(--stone); padding: 12px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.prod-table td { padding: 11px 18px; border-bottom: 1px solid var(--line); color: var(--stone-2); }
.prod-table tr:last-child td { border-bottom: 0; }
.prod-table td.n, .prod-table th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.prod-table td.hi { color: var(--fg); font-weight: 600; }
.prod-refs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 960px; }
.prod-ref { display: block; text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; transition: border-color 160ms var(--ease-out-standard), transform 160ms var(--ease-out-standard); }
.prod-ref:hover { border-color: var(--bronze); transform: translateY(-3px); }
.prod-ref img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; margin: 0 0 16px; display: block; }
.prod-ref .k { font-family: 'Inter Tight', sans-serif; font-size: 12px; color: var(--stone); margin: 0 0 10px; }
.prod-ref h4 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 18px; line-height: 1.2; letter-spacing: -0.01em; color: var(--fg); margin: 0; }
@media (max-width: 720px) {
  .prod-grid { grid-template-columns: 1fr; gap: 32px; }
  .prod-refs { grid-template-columns: 1fr; }
  .prod-step { grid-template-columns: 1fr; gap: 10px; }
}
