<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brevitas — make your models cheaper</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/brevitas-mark.ico" sizes="any">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --ink: #06070b;
    --line: rgba(255, 255, 255, 0.18);
    --stone: rgba(255, 255, 255, 0.55);
    --stone-2: rgba(255, 255, 255, 0.65);
    --bone: #f5f7ff;
    --bone-dim: rgba(255, 255, 255, 0.78);
    --bronze: #8ea6ff;
    --signal: #8dd8c6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter Tight', system-ui, sans-serif;
    cursor: none;
  }

  /* fixed 1080x1920 portrait stage, scaled to fit and letterboxed on any screen */
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    position: relative;
    width: 1080px;
    height: 1920px;
    flex: none;
    overflow: hidden;
    transform-origin: center;
  }

  .serif {
    font-family: 'Newsreader', Georgia, serif;
    font-variation-settings: "opsz" 36;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* background — same artwork as the dark-mode landing hero */
  .backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .backdrop img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 68% 28%;
  }
  /* quiet ASCII drift over the artwork, under the scrim */
  #ascii {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0.8;
    pointer-events: none;
  }
  /* same scrim idea as the landing hero: light at top, dark at bottom */
  .scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(0, 0, 0, 0.30) 0%,
      rgba(0, 0, 0, 0.18) 30%,
      rgba(0, 0, 0, 0.38) 62%,
      rgba(0, 0, 0, 0.78) 100%);
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 106px 65px 96px;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
  }

  /* top: wordmark, same as the site nav */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    animation: fadeDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .brand img { height: 56px; width: auto; }
  .brand span {
    font-weight: 700;
    letter-spacing: -0.02em;
    font-size: 54px;
    color: #fff;
  }

  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 86px;
  }

  h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-variation-settings: "opsz" 36;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 0.98;
    text-wrap: balance;
    font-size: 161px;
    max-width: 972px;
    color: #fff;
    animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
  }
  h1 em {
    font-style: italic;
    color: #a9baff;
    text-shadow:
      0 3px 8px rgba(0, 0, 0, 0.95),
      0 0 20px rgba(0, 0, 0, 0.9),
      0 0 44px rgba(0, 0, 0, 0.85);
  }

  /* same input / same output */
  .parity {
    display: flex;
    flex-direction: column;
    gap: 42px;
    align-items: center;
    animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
  }
  .parity .line {
    font-family: 'Newsreader', Georgia, serif;
    font-variation-settings: "opsz" 36;
    font-weight: 300;
    font-size: 83px;
    line-height: 1.12;
    color: var(--bone-dim);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .parity .line strong { color: #fff; font-weight: 400; }
  .parity .line em {
    font-style: italic;
    color: #a9baff;
    text-shadow:
      0 3px 8px rgba(0, 0, 0, 0.95),
      0 0 20px rgba(0, 0, 0, 0.9),
      0 0 44px rgba(0, 0, 0, 0.85);
  }

  /* money */
  .money-block { animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
  .money-label {
    letter-spacing: 0.34em;
    text-transform: uppercase;
    font-size: 26px;
    color: var(--stone-2);
    margin-bottom: 31px;
  }
  .money {
    font-variant-numeric: tabular-nums;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
    font-size: 151px;
    color: #fff;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .money .cents {
    font-size: 0.42em;
    color: var(--bone-dim);
    display: inline-flex;
    align-items: flex-end;
  }
  /* odometer digits — each digit is a window onto a rolling 0-9 strip */
  .roll {
    display: inline-block;
    height: 1em;
    overflow: hidden;
  }
  .strip {
    display: block;
    transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .strip.notrans { transition: none; }
  .dig {
    display: block;
    height: 1em;
    line-height: 1;
    text-align: center;
  }

  /* partner logo carousel */
  .partners {
    width: 100%;
    animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both;
  }
  .partners-label {
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: 28px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 38px;
  }
  .marquee {
    overflow: hidden;
    width: 100%;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }
  .marquee-track {
    display: flex;
    align-items: center;
    gap: 76px;
    width: max-content;
    animation: marquee 30s linear infinite;
  }
  .marquee-track img {
    height: 60px;
    width: auto;
    max-width: 259px;
    object-fit: contain;
    opacity: 0.92;
  }
  /* icon-only marks get their name set beside them */
  .partner-lockup {
    display: flex;
    align-items: center;
    gap: 0.55em;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 46px;
    color: rgba(255, 255, 255, 0.92);
  }
  .partner-lockup img { height: 54px; }
  /* colored logos designed for white sites sit in a white chip */
  .partner-chip {
    background: #fff;
    border-radius: 14px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
  }
  .partner-chip img { height: 48px; }
  /* Native: serif wordmark + gold star, rebuilt as a vector lockup */
  .partner-serif {
    font-family: 'Newsreader', Georgia, serif;
    font-variation-settings: "opsz" 36;
    font-weight: 400;
    color: #f2ead6;
    font-size: 56px;
  }
  .partner-serif svg { height: 0.8em; width: 0.8em; fill: #e3b54e; }
  .round { border-radius: 50%; }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .money-sub {
    margin-top: 35px;
    font-size: 42px;
    color: var(--bone-dim);
    font-weight: 300;
  }
  .money-sub strong { color: #fff; font-weight: 500; }

  /* bottom */
  .cta {
    display: flex;
    flex-direction: column;
    gap: 38px;
    align-items: center;
    animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
  }
  .qr-card {
    background: #fff;
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .qr-card svg {
    display: block;
    width: 250px;
    height: 250px;
  }
  .qr-label {
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: 24px;
    color: var(--stone-2);
  }
  .cta .url {
    font-size: 44px;
    letter-spacing: 0.06em;
    color: #fff;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>

</div><!-- /.frame -->

<script>
/* scale the fixed 1080x1920 frame to fit whatever screen this runs on */
(function () {
  const frame = document.querySelector('.frame');
  function fit() {
    frame.style.transform =
      'scale(' + Math.min(innerWidth / 1080, innerHeight / 1920) + ')';
  }
  fit();
  addEventListener('resize', fit);
})();
</script>

<script>
/* quiet ASCII drift: a few sparse glyph columns sinking slowly with a short
   fading tail. ~10fps, low alpha, dimmed further by the scrim above it. */
(function () {
  const canvas = document.getElementById('ascii');
  const ctx = canvas.getContext('2d');
  const FW = 1080, FH = 1920;
  const CHARS = '01<>{}[]=+/\\|:·$';
  let cols = [], fs;

  function resize() {
    canvas.width = FW * devicePixelRatio;
    canvas.height = FH * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    fs = 27;
    const n = Math.ceil(FW / (fs * 2.2));
    cols = Array.from({ length: n }, (_, i) => ({
      x: i * fs * 2.2 + Math.random() * fs,
      y: Math.random() * FH,
      v: 0.35 + Math.random() * 0.7,
      trail: 5 + (Math.random() * 7 | 0),
    }));
  }
  resize();
  addEventListener('resize', resize);

  function frame() {
    ctx.clearRect(0, 0, FW, FH);
    ctx.font = fs + "px 'JetBrains Mono', monospace";
    for (const col of cols) {
      for (let k = 0; k < col.trail; k++) {
        const a = (1 - k / col.trail) * 0.5;
        ctx.fillStyle = (k === 0 && Math.random() > 0.92)
          ? 'rgba(141, 216, 198, ' + a + ')'
          : 'rgba(142, 166, 255, ' + a + ')';
        ctx.fillText(CHARS[Math.random() * CHARS.length | 0], col.x, col.y - k * fs);
      }
      col.y += col.v * fs * 0.35;
      if (col.y - col.trail * fs > FH) col.y = -Math.random() * FH * 0.25;
    }
  }

  frame();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let last = 0;
    (function tick(t) {
      if (t - last > 100) { last = t; frame(); }
      requestAnimationFrame(tick);
    })(0);
  }
})();

/* seamless marquee: the track animates to -50%, so its content must appear twice */
(function () {
  const track = document.getElementById('partner-track');
  track.innerHTML += track.innerHTML;
})();

/* live dollar counter. Starts at $6,391.28 and climbs sporadically — mostly
   20-60¢ nudges at irregular intervals, occasional multi-dollar bursts,
   averaging ≈ $0.14/s (≈ +$2,060 over 4 hours). State persists in
   localStorage so a page reload doesn't reset the number; while the page
   was closed the total advances at the average rate. Digits roll
   odometer-style: each digit is a window onto a 0-9 strip that only ever
   rolls forward. */
(function () {
  const START = 6391.28;
  const AVG_RATE = 0.14;                      // $/second, catch-up pace
  const el = document.getElementById('money');

  /* v2: key bumped 2026-08-07 to reset every screen back to START;
     stale v1 state is discarded */
  const KEY = 'tv_saved_counter_v2';

  let total = START;
  try {
    localStorage.removeItem('tv_saved_counter');
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && saved.total >= START) {
      total = saved.total + ((Date.now() - saved.t) / 1000) * AVG_RATE;
    }
  } catch (e) {}

  function persist() {
    try {
      localStorage.setItem(KEY,
        JSON.stringify({ total, t: Date.now() }));
    } catch (e) {}
  }
  let slots = [];        // rolling digit slots, dollars first then 2 cents
  let dollarLen = 0;     // digit count the current DOM was built for

  function makeRoll() {
    const roll = document.createElement('span');
    roll.className = 'roll';
    const strip = document.createElement('span');
    strip.className = 'strip';
    // two 0-9 cycles so a 9→0 wrap can keep rolling forward, then snap back
    for (let k = 0; k < 2; k++) {
      for (let i = 0; i < 10; i++) {
        const d = document.createElement('span');
        d.className = 'dig';
        d.textContent = i;
        strip.appendChild(d);
      }
    }
    roll.appendChild(strip);
    slots.push({ strip, pos: 0 });
    return roll;
  }

  function build(dollarStr) {
    slots = [];
    el.textContent = '';
    const sym = document.createElement('span');
    sym.textContent = '$';
    el.appendChild(sym);
    for (const ch of dollarStr) {
      if (ch === ',') {
        const c = document.createElement('span');
        c.textContent = ',';
        el.appendChild(c);
      } else {
        el.appendChild(makeRoll());
      }
    }
    const cents = document.createElement('span');
    cents.className = 'cents';
    const dot = document.createElement('span');
    dot.textContent = '.';
    cents.appendChild(dot);
    cents.appendChild(makeRoll());
    cents.appendChild(makeRoll());
    el.appendChild(cents);
    dollarLen = dollarStr.replace(/,/g, '').length;
  }

  function setDigit(slot, target) {
    const cur = slot.pos % 10;
    if (cur === target) return;
    slot.pos += (target - cur + 10) % 10;   // always roll forward
    slot.strip.style.transform = 'translateY(-' + slot.pos + 'em)';
    if (slot.pos >= 10) {
      // after the roll lands in the second cycle, snap back invisibly
      setTimeout(() => {
        slot.strip.classList.add('notrans');
        slot.pos -= 10;
        slot.strip.style.transform = 'translateY(-' + slot.pos + 'em)';
        void slot.strip.offsetHeight;
        slot.strip.classList.remove('notrans');
      }, 760);
    }
  }

  function render() {
    const dollars = Math.floor(total);
    const cents = Math.floor((total - dollars) * 100);
    const dollarStr = dollars.toLocaleString('en-US');
    const digits = (dollarStr.replace(/,/g, '') + String(cents).padStart(2, '0')).split('');
    if (digits.length - 2 !== dollarLen) build(dollarStr);
    digits.forEach((d, i) => setDigit(slots[i], +d));
  }

  /* sporadic ticks: random 0.5-6.5s waits, then a jump —
     ~20% tiny drip (2-10¢), ~76% typical 20-60¢, ~4% burst ($2-8) */
  function tick() {
    setTimeout(() => {
      const r = Math.random();
      if (r < 0.04)      total += 2 + Math.random() * 6;
      else if (r < 0.24) total += 0.02 + Math.random() * 0.08;
      else               total += 0.20 + Math.random() * 0.40;
      render();
      persist();
      tick();
    }, 500 + Math.random() * 6000);
  }

  build(Math.floor(total).toLocaleString('en-US'));
  // entrance: strips sit at 0, then roll up to the live value
  setTimeout(render, 900);
  tick();
})();
</script>
</body>
</html>
