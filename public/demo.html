<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/brevitas-mark.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brevitas-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brevitas-mark-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/brevitas-mark-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/brevitas-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Demo · Brevitas Systems</title>
<meta name="description" content="Type any prompt and watch Brevitas decide whether it can reuse a past answer — and how much it saves — in real time.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>/* pre-paint theme to prevent flash on navigation */(function(){try{var t=localStorage.getItem("theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");var r=localStorage.getItem("reduceMotion"),p=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;if(r==="1"||(!r&&p)){document.documentElement.setAttribute("data-reduce-motion","true");}}catch(e){}})();</script>
<link rel="stylesheet" href="theme.css">
<script src="theme-init.js" defer></script>
<link rel="stylesheet" href="/responsive.css">
<script src="/analytics.js" defer data-brevitas-analytics="true"></script>
<style>
  /* --- Demo-only styles, built on the site's design tokens so it reads native. --- */
  .demo-console {
    position: relative;
    background: radial-gradient(120% 90% at 50% -10%, rgba(46, 46, 238,0.045), transparent 60%), var(--ink-2);
    border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .demo-console::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3; box-shadow: inset 0 0 120px rgba(0,0,0,0.4); border-radius: 18px; }
  .demo-bar { position: relative; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: rgba(6,7,11,0.3); }
  .demo-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; background: rgba(6,7,11,0.4); }
  .seg button { background: transparent; border: 0; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--stone-2); padding: 7px 14px; border-radius: 999px; transition: all var(--dur-sm) var(--ease-out-standard); white-space: nowrap; }
  .seg button.on { background: var(--bronze); color: #07101f; font-weight: 500; }
  .seg button:not(.on):hover { color: var(--fg); }

  /* ---------------- Pipeline stage: cards on top, transport rail below ---------------- */
  .stage { position: relative; padding: 40px 0 88px; overflow-x: auto; overflow-y: hidden; }
  .stage-inner { position: relative; min-width: 980px; }
  .phase-row { display: flex; gap: 30px; margin-bottom: 12px; }
  .phase { font-family:'JetBrains Mono',monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--stone); text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid var(--line); }

  .node-row { position: relative; display: flex; gap: 30px; z-index: 2; }
  .node {
    position: relative; flex: 1 1 0; min-width: 108px;
    border: 1px solid var(--line); border-radius: 12px; padding: 15px 15px 16px; background: rgba(13,17,28,0.62);
    opacity: 0.45; transform: translateY(0);
    transition: opacity 520ms var(--ease-out-soft), border-color 520ms var(--ease-out-soft),
                box-shadow 520ms var(--ease-out-soft), transform 520ms var(--ease-out-soft), filter 520ms var(--ease-out-soft);
  }
  .node.done { opacity: 1; border-color: rgba(46, 46, 238,0.28); }
  .node.active { opacity: 1; border-color: var(--bronze); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(46, 46, 238,0.14); }
  .node.hit { opacity: 1; border-color: var(--signal); box-shadow: 0 10px 30px var(--signal-glow); }
  .node.paid.active, .node.paid.done { border-color: var(--oxblood); }
  .node.skipped { opacity: 0.28; filter: grayscale(0.6); border-style: dashed; }
  .node .pn-k { font-family:'JetBrains Mono',monospace; font-size: 9px; letter-spacing: 0.14em; color: var(--stone); text-transform: uppercase; }
  .node .pn-t { font-family:'Newsreader',serif; font-size: 17px; font-weight: 400; color: var(--fg); margin-top: 8px; line-height: 1.15; letter-spacing: -0.01em; }
  .node .pn-s { font-family:'JetBrains Mono',monospace; font-size: 10.5px; color: var(--stone); margin-top: 7px; min-height: 14px; }
  .node.active .pn-s, .node.done .pn-s { color: var(--stone-2); }
  .node .pn-skiptag { position:absolute; top:8px; right:10px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.08em; color:var(--stone); }

  /* overlay: stems + rail + pins + beam + packet + trail (all below the cards) */
  .stage-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .stem { position: absolute; width: 1px; background: var(--line); transform: translateX(-0.5px); transition: background 460ms var(--ease-out-soft); }
  .stem.on { background: rgba(46, 46, 238,0.5); }
  .stem.hiton { background: rgba(141,216,198,0.6); }
  .stem.skipped { opacity: 0.3; }
  .rail { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--line) 10%, var(--line) 90%, transparent); }
  .beam { position: absolute; left: 0; height: 2px; background: linear-gradient(90deg, rgba(46, 46, 238,0) 0%, rgba(46, 46, 238,0.4) 45%, var(--bronze) 100%); box-shadow: 0 0 10px rgba(46, 46, 238,0.4); }
  .beam.hit { background: linear-gradient(90deg, rgba(141,216,198,0) 0%, rgba(141,216,198,0.4) 45%, var(--signal) 100%); box-shadow: 0 0 10px var(--signal-glow); }
  .pin { position: absolute; width: 8px; height: 8px; border-radius: 999px; background: var(--ink-3); border: 1px solid var(--line); transform: translate(-50%, -50%); transition: all 460ms var(--ease-out-soft); }
  .pin.on { background: var(--bronze); border-color: var(--bronze); box-shadow: 0 0 8px rgba(46, 46, 238,0.6); }
  .pin.hiton { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 8px var(--signal-glow); }
  .pin.paid.on { background: var(--oxblood); border-color: var(--oxblood); box-shadow: 0 0 8px rgba(201,128,120,0.6); }
  .ghost { position: absolute; width: 7px; height: 7px; border-radius: 999px; background: var(--bronze); filter: blur(1px); will-change: transform, opacity; }
  .ghost.hit { background: var(--signal); }
  .pk {
    position: absolute; left: 0; top: 0; will-change: transform;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    font-family:'JetBrains Mono',monospace; font-size: 11.5px; font-weight: 500;
    border: 1px solid var(--bronze); color: #eaefff; background: rgba(20,26,44,0.94);
    border-radius: 999px; padding: 6px 13px; box-shadow: 0 0 16px rgba(46, 46, 238,0.35), 0 6px 16px rgba(0,0,0,0.45);
  }
  .pk.hit { border-color: var(--signal); box-shadow: 0 0 16px rgba(141,216,198,0.4), 0 6px 16px rgba(0,0,0,0.45); }
  .pk-core { width: 6px; height: 6px; border-radius: 999px; background: var(--bronze); box-shadow: 0 0 8px var(--bronze); }
  .pk.hit .pk-core { background: var(--signal); box-shadow: 0 0 8px var(--signal); }
  .replay-badge {
    position: absolute; transform: translate(-50%, -50%);
    font-family:'JetBrains Mono',monospace; font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--signal); border: 1px solid var(--signal); border-radius: 999px; padding: 8px 13px;
    background: rgba(6,7,11,0.9); box-shadow: 0 0 20px var(--signal-glow);
    opacity: 0; scale: 0.84; transition: opacity 360ms var(--ease-out-soft), scale 360ms var(--ease-out-soft); white-space: nowrap;
  }
  .replay-badge.show { opacity: 1; scale: 1; }
  .drop-tag { position: absolute; transform: translate(-50%, 0); font-family:'JetBrains Mono',monospace; font-size: 11px; color: var(--oxblood); animation: dropfloat 1200ms var(--ease-out-soft) forwards; pointer-events: none; white-space: nowrap; }
  @keyframes dropfloat { 0% { opacity: 0; transform: translate(-50%, 8px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -26px); } }

  /* Live narrator — the plain-English explanation */
  .narrator {
    display: flex; align-items: flex-start; gap: 14px; padding: 20px 22px;
    border: 1px solid var(--line); border-left: 2px solid var(--stone); border-radius: 12px;
    background: rgba(13,17,28,0.5); transition: border-color 400ms var(--ease-out-soft);
  }
  .narrator.free { border-left-color: var(--signal); }
  .narrator.paid { border-left-color: var(--oxblood); }
  .narrator .n-ico { font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--stone-2); margin-top: 3px; flex: 0 0 auto; }
  .narrator .n-txt { font-family:'Newsreader',serif; font-size: clamp(17px, 1.7vw, 20px); font-weight: 300; line-height: 1.45; color: var(--bone-dim); letter-spacing: -0.01em; }
  .narrator .n-txt strong { color: var(--fg); font-weight: 500; }
  .narrator .n-txt .free { color: var(--signal); }

  /* Stat tiles */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; position: relative; z-index: 4; }
  .stat-tile { border: 1px solid var(--line); border-radius: 13px; padding: 18px 20px; background: rgba(13,17,28,0.5); }
  .stat-tile .v { font-family:'Newsreader',serif; font-weight: 300; font-size: clamp(28px,3vw,42px); line-height: 1; letter-spacing:-0.02em; color: var(--fg); font-variant-numeric: tabular-nums; }
  .stat-tile .l { font-family:'JetBrains Mono',monospace; font-size: 11px; color: var(--stone-2); margin-top: 10px; letter-spacing: 0.04em; }

  /* Ledger */
  .ledger-row { display: grid; grid-template-columns: 22px 118px 1fr auto; gap: 16px; align-items: center; padding: 14px 4px; border-top: 1px solid var(--line); animation: ledgerin 520ms var(--ease-out-soft); }
  @keyframes ledgerin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .badge { font-family:'JetBrains Mono',monospace; font-size: 10px; letter-spacing: 0.04em; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; text-align:center; }
  .badge.exact { color: var(--signal); border-color: var(--signal); }
  .badge.semantic { color: var(--signal); border-color: var(--signal); }
  .badge.miss { color: var(--stone-2); border-color: var(--stone); }
  .chip { font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--stone-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; background: rgba(6,7,11,0.35); cursor: pointer; transition: all var(--dur-sm) var(--ease-out-standard); }
  .chip:hover { color: var(--fg); border-color: var(--bronze); }
  .demo-input { width: 100%; background: rgba(6,7,11,0.55); border: 1px solid rgba(111,132,214,0.35); border-radius: 11px; padding: 15px 16px; color: var(--fg); font-family:'Inter Tight',sans-serif; font-size: 15px; resize: vertical; min-height: 58px; transition: border-color var(--dur-sm), box-shadow var(--dur-sm), background var(--dur-sm); }
  .demo-input:focus { outline: none; border-color: #2e2eee; background: rgba(46, 46, 238,0.06); box-shadow: 0 0 0 3px rgba(46, 46, 238,0.15); }

  /* Plain "how it works" strip */
  .how-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .how-step { display: flex; gap: 14px; align-items: flex-start; }
  .how-num { font-family:'Newsreader',serif; font-size: 34px; font-weight: 300; line-height: 1; color: var(--bronze); flex: 0 0 auto; }
  .how-step h4 { font-family:'Newsreader',serif; font-size: 20px; font-weight: 400; margin: 0 0 6px; letter-spacing: -0.01em; }
  .how-step p { margin: 0; color: var(--bone-dim); font-size: 15px; line-height: 1.5; }

  @media (max-width: 820px) { .how-strip { grid-template-columns: 1fr; gap: 24px; } }
  @media (max-width: 720px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .ledger-row { grid-template-columns: 20px 100px 1fr; }
    .ledger-row .lr-num { grid-column: 1 / 2; }
    .ledger-row .lr-save { grid-column: 2 / 4; text-align: left; }
  }
</style>
</head>

<div id="app"></div>
