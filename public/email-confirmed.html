<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Email confirmed · Brevitas Systems</title>
  <link rel="icon" href="/brevitas-mark.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/brevitas-mark.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/brevitas-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="/analytics.js" defer data-brevitas-analytics="true"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef0f7; color: #0d1530; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(100%, 480px); padding: 48px; text-align: center; background: #fff; border: 1px solid #e2e4f0; border-radius: 24px; box-shadow: 0 18px 60px rgba(13, 21, 48, .08); }
    .brand { width: 180px; height: auto; margin-bottom: 36px; }
    .check { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 50%; background: #e4f4ef; color: #2d8a6e; font-size: 26px; }
    h1 { margin: 0; font: 40px/1.1 Georgia, serif; font-weight: 400; }
    p { margin: 16px 0 30px; color: #687092; line-height: 1.6; }
    a { display: block; padding: 14px 20px; border-radius: 12px; background: #4f5fc4; color: #fff; text-decoration: none; font-weight: 600; }
    a:hover { opacity: .9; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      main { padding: 32px 22px; border-radius: 16px; }
      .brand { width: 160px; margin-bottom: 28px; }
      h1 { font-size: 34px; }
      a { min-height: 48px; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0c0c0c; color: #eee; }
      main { background: #141414; border-color: #242424; box-shadow: none; }
      p { color: #aaa; }
    }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="/assets/b-logo-tight.png" alt="Brevitas">
    <div class="check" aria-hidden="true">✓</div>
    <h1 id="title">Your email is confirmed.</h1>
    <p id="message">Your account is ready. Sign in to open your token tracking dashboard.</p>
    <a id="continue" href="/login">Continue to sign in →</a>
  </main>
  <script>
    // GoTrue puts the verified session in the URL *fragment*
    // (`#access_token=…&refresh_token=…&expires_in=…&token_type=bearer`) and puts
    // failures there too, while `?audience=` arrives in the query string. Merge both
    // the way @supabase/auth-js's parseParametersFromURL does — hash first, query
    // wins on collision — so neither source can mask the other.
    const params = new URLSearchParams();
    for (const source of [location.hash.slice(1), location.search.slice(1)]) {
      for (const [key, value] of new URLSearchParams(source)) params.set(key, value);
    }
    const audience = params.get('audience');
    const destinations = {
      personal: '/login/personal',
      enterprise: '/login/enterprise',
    };
    const continueLink = document.querySelector('#continue');
    let target = destinations[audience] || '/login';
    if (destinations[audience]) {
      const label = audience === 'personal' ? 'personal' : 'enterprise';
      continueLink.textContent = `Continue to ${label} sign in →`;
    }

    const failed = Boolean(params.get('error') || params.get('error_description') || params.get('error_code'));
    // A real session is present. This page is static and deliberately ships no auth
    // SDK, so it must not try to persist the session itself — hand-writing auth-js's
    // storage record would silently rot the moment its key format or flow type moves.
    // Instead carry the fragment verbatim onto a dashboard route: those paths are
    // rewritten to the SPA, whose Supabase client runs with the auth-js defaults
    // (flowType 'implicit', detectSessionInUrl true, persistSession true) and so
    // validates the tokens and writes the session under its own storage key.
    // Fragments are never sent to the server and the analytics layer strips them
    // from `$current_url`, so nothing leaks by forwarding one.
    const hasSession = Boolean(params.get('access_token') && params.get('refresh_token'));
    if (hasSession && !failed) {
      target += location.hash;
      continueLink.textContent = 'Continue to your dashboard →';
      document.querySelector('#message').textContent = 'Your account is ready. Continue to open your token tracking dashboard.';
    }
    continueLink.href = target;

    if (failed) {
      document.querySelector('.check').textContent = '!';
      document.querySelector('#title').textContent = 'That link did not work.';
      document.querySelector('#message').textContent = params.get('error_description') || 'The confirmation link may have expired. Sign in to request another.';
    }
  </script>
</body>
</html>
