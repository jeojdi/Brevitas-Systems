<script type="text/babel">
const H2 = ({ children }) => (
  <h2 className="serif fade-up" style={{ fontSize: 'clamp(26px, 3.4vw, 36px)', fontWeight: 400, letterSpacing: '-0.02em', margin: '8px 0 24px' }}>{children}</h2>
);
const P = ({ children, last }) => (
  <p className="t-body fade-up" style={{ marginBottom: last ? 0 : 22, maxWidth: 720 }}>{children}</p>
);
const Block = ({ children, top = 52 }) => (
  <section className="section" style={{ paddingTop: top, paddingBottom: 0 }}>
    <div className="container" style={{ maxWidth: 760 }}>{children}</div>
  </section>
);
const Mono = ({ children }) => <span className="mono" style={{ color: 'var(--signal)' }}>{children}</span>;

const INK = 'var(--bronze)', RIVAL_A = 'var(--stone)', RIVAL_B = 'var(--stone-2)', GRID = 'var(--line)', TEXT = 'var(--stone)', TEXT_STRONG = 'var(--fg)';
const mono = "'JetBrains Mono', ui-monospace, monospace";

const H2H = [
  { cell: '25% of 16k', splice: 9.58, info: 5.07, blend: 4.64 },
  { cell: '25% of 32k', splice: 12.43, info: 5.57, blend: 4.47 },
  { cell: '33% of 32k', splice: 7.49, info: 3.15, blend: 1.58 },
  { cell: '73% of 16k', splice: 1.41, info: 0.83, blend: 0.69 },
];
function HeadToHeadChart() {
  const W = 680, rowH = 58, L = 110, R = 56, T = 8;
  const H = T + H2H.length * rowH + 24;
  const max = 13;
  const w = v => (v / max) * (W - L - R);
  const bars = [['splice', INK, 'Splice'], ['info', RIVAL_B, 'InfoFlow'], ['blend', RIVAL_A, 'CacheBlend']];
  return (
    <figure className="splice-fig fade-up">
      <h3>Same sessions, same quality check</h3>
      <p className="sub">1× H100 · Qwen2.5-14B · 12 real OpenHands agent sessions per row · each method at the smallest recompute fraction that passes · higher is faster</p>
      <div className="splice-legend">
        {bars.map(([k, c, label]) => <span key={k}><i style={{ background: c }}></i>{label}</span>)}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Grouped bar chart of speed-up over re-ingest. 25% of 16k: Splice 9.6x, InfoFlow 5.1x, CacheBlend 4.6x. 25% of 32k: 12.4x, 5.6x, 4.5x. 33% of 32k: 7.5x, 3.2x, 1.6x. 73% of 16k: 1.4x, 0.8x, 0.7x.">
        <line x1={L + w(1)} x2={L + w(1)} y1={T} y2={H - 24} style={{ stroke: GRID }} strokeDasharray="4 4" />
        <text x={L + w(1)} y={H - 8} textAnchor="middle" style={{ fill: TEXT, fontFamily: mono, fontSize: 11 }}>1×</text>
        {H2H.map((d, r) => (
          <g key={d.cell}>
            <text x={L - 12} y={T + r * rowH + 28} textAnchor="end" style={{ fill: TEXT_STRONG, fontSize: 12.5 }}>{d.cell}</text>
            {bars.map(([k, c], j) => (
              <g key={k}>
                <rect x={L} y={T + r * rowH + 6 + j * 15} width={Math.max(w(d[k]), 2)} height="12" rx="2" style={{ fill: c }} />
                <text x={L + w(d[k]) + 6} y={T + r * rowH + 16 + j * 15} style={{ fill: j === 0 ? TEXT_STRONG : TEXT, fontFamily: mono, fontSize: 11 }}>{d[k].toFixed(1)}×</text>
              </g>
            ))}
          </g>
        ))}
      </svg>
      <figcaption>Deleted share of the context on the left. Speed-up is over a full re-ingest of the edited sequence on the same GPU. InfoFlow and CacheBlend were reimplemented inside our harness, not run from released code. The gap is widest where the deletion is moderate and residue is genuinely sparse; at 73% the sequence has changed enough that every method approaches a full recompute.</figcaption>
    </figure>
  );
}

function Paper() {
  useFadeUpReveal();
  return (
    <>
      <Nav current="blog" />

      <section className="section" style={{ paddingBottom: 0 }}>
        <div className="container" style={{ maxWidth: 760 }}>
          <div className="fade-up in" style={{ marginBottom: 22 }}><span className="paper-badge">RESEARCH PAPER</span></div>
          <h1 className="serif fade-up in" style={{ fontSize: 'clamp(34px, 5vw, 60px)', fontWeight: 400, letterSpacing: '-0.025em', lineHeight: 1.07, margin: '0 0 24px' }}>
            Dependency-ranked repair: recomputing only the rows a cache edit breaks.
          </h1>
          <div className="paper-abstract fade-up in">
            <p className="lbl">Abstract</p>
            <p>Re-rotation makes a deleted cache exact in position but leaves content residue in the downstream rows that attended to the removed span. We show the residue is sparse and predictable: it concentrates on a small set of tokens whose attention placed significant mass on the deletion. We score every downstream row by that dependency, recompute the top fraction c in a single batched forward at corrected positions over the edited cache, and leave the rest. Across real agent sessions, c between two and twenty percent restores certified quality, and because the repaired rows are scattered rather than a contiguous window, a run-length batching scheme reproduces per-row repair byte for byte inside a production engine.</p>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 20, padding: '20px 0 40px', borderBottom: '1px solid var(--line)', flexWrap: 'wrap' }}>
            <span className="t-mono" style={{ color: 'var(--stone)', fontSize: 11 }}>Sep 20, 2026</span>
            <span className="t-mono" style={{ color: 'var(--line)' }}>·</span>
            <span className="t-mono" style={{ color: 'var(--stone)', fontSize: 11 }}>11 min read</span>
            <span className="t-mono" style={{ color: 'var(--line)' }}>·</span>
            <span className="t-mono" style={{ fontSize: 10, color: 'var(--bronze)', padding: '3px 8px', border: '1px solid var(--bronze)', borderRadius: 2, letterSpacing: '0.1em' }}>RESEARCH</span>
          </div>
        </div>
      </section>

      <article>
        <Block>
          <H2>1. Residue after a mid-sequence delete.</H2>
          <P>Deleting a span at the very end of a sequence is free after re-rotation, because nothing after the cut ever attended to the removed tokens. A mid-sequence delete is not free. Every key and value downstream of the seam was computed in a forward pass that attended to the span you just removed. Their positions can be corrected exactly by a rotation, as shown in the companion note, but their content still reflects information that is no longer in the sequence. Left alone, this residue is what separates an edited cache from the cache a fresh prefill would have produced.</P>
          <P>The naive fixes are the two ends of a spectrum. Recompute nothing and you keep the residue; on a 25 percent deletion that pushes the pooled p95 KL well past any usable threshold. Recompute the entire suffix and you are back to re-prefilling, which is the cost Splice exists to avoid. The useful regime is in between, and the question this paper answers is which rows to spend recompute on.</P>
        </Block>

        <Block>
          <H2>2. Residue is sparse.</H2>
          <P>The key observation is that not every downstream row depends on the deleted span equally. A token whose attention, at the layer and head level, placed almost no mass on the deleted positions barely notices they are gone; its key and value are already what a fresh prefill would write, up to the position correction. A token that attended heavily to the deleted span carries most of the error. Residue, in other words, is not spread evenly over the suffix. It concentrates on a minority of tokens, and that minority is identifiable before you recompute anything, because the attention that created the dependency was already computed once.</P>
          <P>We make this precise with a dependency score. For a downstream row <Mono>i</Mono> and a deleted span <Mono>D</Mono>, aggregate the attention weight that row <Mono>i</Mono> assigned to positions in <Mono>D</Mono>, summed over the positions in the span and pooled across heads and layers with a depth weighting that favors the layers where the model actually mixes content:</P>
          <div className="paper-eq fade-up">
            <span className="cmt"># dependency of row i on the deleted span D</span>{'\n'}
            s(i) = Σ<span className="k">ℓ</span> w<span className="k">ℓ</span> · Σ<span className="k">h</span> Σ<span className="k">j ∈ D</span>  A<span className="k">ℓ,h</span>(i, j){'\n\n'}
            <span className="cmt"># rank all suffix rows by s, recompute the top fraction c</span>{'\n'}
            repair_set = top-c {'{ s(i) : i after the seam }'}
          </div>
          <P>The score is cheap because <Mono>A</Mono>, the attention map, is a by-product of the passes the model already ran; no extra forward is needed to rank. Sorting the suffix by <Mono>s</Mono> and taking the top fraction <Mono>c</Mono> gives the repair set. Critically, that set is scattered: the rows that depend on a span in the middle of a document are wherever the model happened to refer back to it, not a contiguous window sitting just after the seam. Repairing a contiguous window after the seam, which is what a naive seam-patch does, spends compute on rows that did not need it and misses rows that did.</P>
        </Block>

        <Block>
          <H2>3. Repair as one batched forward.</H2>
          <P>Given the repair set, Splice recomputes those rows in a single batched forward pass at their corrected positions over the already-edited cache. The rest of the cache, position-corrected and residue-free by assumption, serves as the context those rows attend to. New keys and values are written back into exactly the slots the repaired rows occupy; everything else is left as it was after re-rotation.</P>
          <P>Two properties make this safe. The repaired rows attend to a cache that is already correct for every row they were going to keep, so a single pass suffices and there is no iterative settling. And because repair writes only into the scattered slots it selected, it composes with the exact re-rotation rather than overwriting it. The budget <Mono>c</Mono> is the one knob: raise it and you recompute more rows and get closer to a full prefill in both quality and cost; lower it and you approach re-rotate-only. Where to set it is a per-edit decision, taken by the certificate described in the companion note, but the empirical range that certifies real edits is narrow, typically two to twenty percent of the suffix.</P>
        </Block>

        <Block>
          <H2>4. The budget curve.</H2>
          <P>Because both Splice's edit and the re-prefill it replaces grow with context, the steady-state per-edit speed-up is roughly flat across context length and is governed almost entirely by <Mono>c</Mono>. Larger models amortize the fixed costs of the batched forward better, so they tolerate smaller budgets and post larger gains. The table below reports per-edit speed-up over re-prefilling from the edit point, alongside the pooled quality, at a fixed 8k context.</P>
          <div className="splice-table-wrap fade-up">
            <table className="splice-table">
              <caption><b>Repair budget versus speed-up and quality</b><span>8k context · 10 edits · per-edit speed-up over re-prefilling from the edit point · c is the fraction of suffix rows recomputed</span></caption>
              <thead><tr><th>Model</th><th className="n">c</th><th className="n">Per-edit speed-up</th><th className="n">p95 KL</th></tr></thead>
              <tbody>
                <tr><td>Qwen2.5-7B-Instruct-1M</td><td className="n">0.15</td><td className="n">1.50×</td><td className="n">0.0005</td></tr>
                <tr><td>Qwen2.5-14B</td><td className="n">0.15</td><td className="n">1.98×</td><td className="n">0.0018</td></tr>
                <tr><td>Qwen2.5-72B-Instruct</td><td className="n">0.15</td><td className="n">1.94×</td><td className="n">0.0015</td></tr>
                <tr><td>Qwen2.5-72B-Instruct</td><td className="n">0.02</td><td className="n hi">3.13×</td><td className="n">0.0084</td></tr>
              </tbody>
            </table>
          </div>
          <P>The last two rows are the point. Dropping the 72B budget from fifteen percent of rows to two percent raises the per-edit gain from 1.94x to 3.13x, while the pooled quality stays roughly six times under the 0.05 threshold. The ranking is doing the work: at two percent, the two percent of rows Splice picks are the ones that carry the residue, so quality holds even as the recompute shrinks. A budget chosen without ranking, spending its two percent on a contiguous post-seam window, does not pass at the same setting.</P>
        </Block>

        <Block>
          <H2>5. Against other cache-reuse methods.</H2>
          <P>Selective recomputation after a cache edit is not a new idea, so the honest comparison is on the same sessions under the same quality gate. We reimplemented the published approaches inside our harness and ran them on twelve real OpenHands agent sessions per cell, each method taking its smallest recompute fraction that passes the gate. Speed-up is over a full re-ingest of the edited sequence on the same GPU.</P>
          <div className="splice-table-wrap fade-up">
            <table className="splice-table">
              <caption><b>Head to head on the same sessions</b><span>Qwen2.5-14B · 1× H100 · 12 OpenHands sessions per row · smallest passing recompute fraction · higher is faster</span></caption>
              <thead><tr><th>Deleted</th><th className="n">Splice</th><th className="n">InfoFlow</th><th className="n">CacheBlend</th></tr></thead>
              <tbody>
                <tr><td>25% of 16k</td><td className="n hi">9.6×</td><td className="n">5.1×</td><td className="n">4.6×</td></tr>
                <tr><td>25% of 32k</td><td className="n hi">12.4×</td><td className="n">5.6×</td><td className="n">4.5×</td></tr>
                <tr><td>33% of 32k</td><td className="n hi">7.5×</td><td className="n">3.2×</td><td className="n">1.6×</td></tr>
                <tr><td>73% of 16k</td><td className="n hi">1.4×</td><td className="n">0.8×</td><td className="n">0.7×</td></tr>
              </tbody>
            </table>
          </div>
          <HeadToHeadChart />
          <P>The gap is widest where the deletion is moderate and the residue is genuinely sparse, which is the common case for agent compaction. At 73 percent deleted the sequence has changed so much that every method approaches a full recompute, and the ratios collapse toward one; Splice still leads, but the honest reading is that very large deletions are close to a re-prefill for everyone. A seam-repair baseline can beat all three on a single lucky session at 25 percent, but it did not reproduce on a second sample and did not pass at 50 percent, which is the failure mode ranking is designed to avoid.</P>
        </Block>

        <Block>
          <H2>6. Inside a serving engine.</H2>
          <P>A standalone harness can gather scattered rows and recompute them with fancy indexing; a production engine has a batched attention kernel and a paged cache, and pays for irregular gather. Splice runs as a radix-cache backend inside SGLang, and there the scattered repair set is coalesced into maximal runs of consecutive rows, which are recomputed as blocks. Block-batched repair is byte-identical to per-row repair, because a run is just a contiguous subset of the same rows, so the coalescing changes the kernel schedule and not the result. On a 16k context with 25 percent deleted, over twelve pooled trajectories with ranking cost charged inside every edit, this reaches 2.75x over SGLang re-prefilling the edited sequence, and the full-recompute control reads exactly zero.</P>
          <P>The remaining cost to beat is the one-time setup pass on smaller models, and admission under shared KV pressure, both of which are properties of the serving path rather than the repair rule. The repair rule itself is simple: residue is sparse, rank it, spend a small batched forward on the rows that carry it, and let the certificate decide when you have spent enough.</P>
        </Block>

        <Block>
          <H2>References.</H2>
          <ol className="paper-refs fade-up">
            <li>Brevitas Systems. Splice: editing a live KV cache instead of re-prefilling it. 2026.</li>
            <li>Brevitas Systems. Exact position surgery: re-rotating a rotary KV cache after a mid-sequence edit. 2026.</li>
            <li>CacheBlend: fast large language model serving for RAG with cached knowledge fusion. 2024.</li>
            <li>OpenHands: an open platform for AI software-development agents. 2024.</li>
          </ol>
        </Block>

        <section className="section" style={{ paddingTop: 40 }}>
          <div className="container" style={{ maxWidth: 760 }}>
            <p className="t-mono fade-up" style={{ color: 'var(--stone)', fontSize: 11, lineHeight: 1.7 }}>
              Measured August–September 2026 on H100 GPUs (1–2 per run) with Hugging Face Transformers, PyTorch and SGLang. Quality gate specified before measurement. Rival methods reimplemented in our harness under one gate, not run from released code. Models: Qwen2.5-7B-Instruct-1M, Qwen2.5-14B, Qwen2.5-72B-Instruct.
            </p>
          </div>
        </section>
      </article>

      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<Paper />);
</script>
