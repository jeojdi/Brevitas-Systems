name: Release orchestrator

# Manual, ordered release gate. Each stage only runs once the previous one has
# passed (needs: chaining), so a release cannot proceed past a failed check:
#
#   guard
#     -> migration release contracts (release:migrations:check)
#     -> credentialed read-only schema-drift check
#     -> operational-readiness evidence (reusable workflow_call)
#     -> credential-free network preflight (release:preflight)
#     -> non-mutating staging smoke (staging only)
#
# Nothing here mutates a target: the schema-drift check opens a read-only session
# and the preflight/smoke stages are non-mutating by contract.
#
# This workflow does NOT block a deployment on its own. Vercel and Railway both
# deploy from a push to main, and neither platform consults a GitHub check, so a
# red run here stops nothing until the external configuration in
# docs/enterprise/OPERATIONAL_READINESS_GATE.md ("Making this gate mandatory") is
# in place. Treat that configuration as part of the control, not as optional.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fixed release environment to gate
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: release-orchestrator-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  guard:
    name: Refuse untrusted or ambiguous release invocation
    # Asserted inside the job, never as a job-level `if:`. An unmet job-level
    # condition SKIPS the job, and every stage below is needs:-chained to this one,
    # so the entire release chain used to skip and GitHub reported the run as a
    # success. Mirrors operational-readiness.yml: an untrusted or ambiguous
    # invocation must fail the run, not quietly produce a green badge.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      TARGET: ${{ inputs.target }}
      REPOSITORY: ${{ github.repository }}
      IS_FORK: ${{ github.event.repository.fork }}
      REF_NAME: ${{ github.ref }}
    steps:
      - name: Require canonical main and a fixed release target
        run: |
          test "$IS_FORK" = "false"
          test "$REPOSITORY" = "jeojdi/Brevitas-Systems"
          test "$REF_NAME" = "refs/heads/main"
          test "$TARGET" = "staging" || test "$TARGET" = "production"

  migrations-check:
    name: Migration release contracts
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Verify migration release contracts
        run: npm run release:migrations:check

  schema-drift:
    name: Credentialed read-only schema-drift check
    needs: migrations-check
    environment: ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'
      - name: Assert deployed schema matches the migration manifest
        run: node scripts/ci/check-schema-drift.mjs

  operational-readiness:
    name: Operational readiness evidence
    needs: schema-drift
    uses: ./.github/workflows/operational-readiness.yml
    with:
      target: ${{ inputs.target }}
    secrets: inherit

  preflight:
    name: Credential-free network preflight
    needs: operational-readiness
    environment: ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'
      - name: Run credential-free release preflight
        env:
          BREVITAS_EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: npm run release:preflight -- ${{ inputs.target }}

  staging-smoke:
    name: Non-mutating staging smoke
    needs: preflight
    if: inputs.target == 'staging'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'
      - name: Run guarded staging smoke
        env:
          STAGING_SMOKE_ALLOWED: 'true'
          STAGING_ENVIRONMENT_CONFIRMATION: staging
          STAGING_API_URL: https://brevitas-api-staging-975273324573.us-west1.run.app
          STAGING_DASHBOARD_URL: https://brevitas-systems-staging.vercel.app
          STAGING_REPOSITORY: ${{ github.repository }}
          STAGING_REPOSITORY_FORK: ${{ github.event.repository.fork }}
          STAGING_GITHUB_EVENT: ${{ github.event_name }}
          STAGING_GITHUB_REF: ${{ github.ref }}
          STAGING_TENANT_A_API_KEY: ${{ secrets.STAGING_TENANT_A_API_KEY }}
          STAGING_TENANT_B_API_KEY: ${{ secrets.STAGING_TENANT_B_API_KEY }}
          STAGING_TENANT_A_JOB_ID: ${{ secrets.STAGING_TENANT_A_JOB_ID }}
          STAGING_TENANT_B_JOB_ID: ${{ secrets.STAGING_TENANT_B_JOB_ID }}
          STAGING_TENANT_A_CUSTOMER_ID: ${{ secrets.STAGING_TENANT_A_CUSTOMER_ID }}
          STAGING_TENANT_B_CUSTOMER_ID: ${{ secrets.STAGING_TENANT_B_CUSTOMER_ID }}
          STAGING_BILLING_USER_TOKEN: ${{ secrets.STAGING_BILLING_USER_TOKEN }}
          STAGING_BILLING_RECOVERY_SECRET: ${{ secrets.STAGING_BILLING_RECOVERY_SECRET }}
        run: node scripts/ci/staging-smoke.mjs
